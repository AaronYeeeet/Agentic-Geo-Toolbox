# Runs before every commit and fixes/checks the staged files.
# One-time setup per clone:  uv tool install pre-commit  &&  pre-commit install
# Run on all files:           pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe] # syntax only; Compose uses custom tags like !override
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"] # data and models do not belong in git
      - id: detect-private-key

  # Python: lint (with auto-fix) and format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Frontend, YAML, JSON, Markdown, CSS
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3.6.2"]
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css, html]
