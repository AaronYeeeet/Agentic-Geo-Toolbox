# Data-source registry. One entry per source with license, exact attribution, coverage and
# verification status. Adding a state or dataset means adding an entry here, not code: the frontend builds the
# aerial basemap from all verified `basemap-aerial` WMS entries and offers `overlay-*` entries as WMS layers;
# GET /api/sources serves this file and the agent's "data" answers read it.
#
# Verified on 2026-11-01 (reachability, CORS from http://localhost:5173, EPSG:3857 GetMap,
# license, exact attribution, usage policy, no key).
# status: verified | needs-proxy (works, but no CORS for the dev origin) | candidate (not yet verified) | later | rejected
# used_for roles: basemap-osm, basemap-official, basemap-light, basemap-relief, basemap-aerial (state DOP WMS and the
# coarse raster fallback), basemap-fallback, overlay-*, terrain, terrain-fallback, hillshade, buildings-2.5d,
# buildings-lod2, geocoding-search, geocoding-backend, osm-features-backend; other roles are informational.

- id: openfreemap-liberty
  title: {en: OpenFreeMap Liberty (OSM vector basemap with 3D buildings), de: OpenFreeMap Liberty (OSM-Vektor-Basiskarte
      mit 3D-Gebäuden)}
  provider: OpenFreeMap (Hyperknot Software Kft., Hungary)
  type: vector-style
  url: https://tiles.openfreemap.org/styles/liberty
  homepage: https://openfreemap.org
  layers: []
  license: {name: ODbL 1.0 (OSM data); OpenMapTiles schema CC BY 4.0; style BSD-3-Clause and CC BY 4.0; OpenFreeMap code
      MIT, url: 'https://github.com/hyperknot/openfreemap/blob/main/LICENSE.md'}
  attribution: OpenFreeMap © OpenMapTiles Data from OpenStreetMap
  coverage:
    name: World (tile data z0-z14, over-zoomed above)
    bbox: [-180, -85.05113, 180, 85.05113]
  cors: true
  usage: 'Free public instance: no key, no registration, no limits on views or requests, commercial use allowed, no SLA
    (may be discontinued without notice). Automated data collection is prohibited except offline downloads of at most 3,000
    tiles or 50 MB each, at most 4 parallel requests, unique User-Agent (ToS 2026-10-14, https://openfreemap.org/tos/).'
  key_required: false
  status: verified
  checked: 2026-11-01
  used_for: [basemap-osm, buildings-2.5d]
  notes: 'Vector source is the TileJSON https://tiles.openfreemap.org/planet (OpenMapTiles schema, tile zoom 0-14, MapLibre
    over-zooms above 14); never hardcode the versioned tile URL (build id in the path changes weekly). Style contains fill-extrusion
    layer ''building-3d'' (minzoom 14, height render_height, base render_min_height, filter excludes hide_3d); at z13 only
    generalized blocks without heights. Buildings are merged per identical attributes: no OSM id or name, no per-building
    picking; render_height defaults to 5 m without height or levels (IGD footprint measured at 11 m). CORS is ACAO * but
    an OPTIONS preflight returns 405, so send no custom request headers. Glyphs only Noto Sans Regular, Bold, Italic. MapLibre
    shows the attribution from the TileJSON automatically. Planet data is a weekly build (2026-10-25).'
