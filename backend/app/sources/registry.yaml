    as strings. polygon_geojson=1 for Darmstadt returns 1917 vertices (44 KB for one result): use polygon_threshold. Output
    language follows Accept-Language (curl sends none, so local names): pass accept-language explicitly. Tested once: q=Darmstadt
    gave relation 62581, lat 49.8727750, lon 8.6511770.'
