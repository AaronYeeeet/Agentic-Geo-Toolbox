    bbox: [-180, -90, 180, 90]
  cors: true
  usage: 'Fair use (https://dev.overpass-api.de/overpass-doc/en/preface/commons.html, https://wiki.openstreetmap.org/wiki/Overpass_API):
    under 10,000 queries and under 1 GB per day for one-off use; for regular automated use divide by 100 (under 100 queries,
    under 10 MB per day); app traffic counts as the sum of all users; User-Agent or Referer identifying the app; no parallel
    scripts (scripts: 1 connection); after 429/406 wait 30 s; commercial use only on own or paid servers. Server is overloaded:
    do not expect reliability.'
  key_required: false
  status: candidate
  checked: 2026-11-01
  used_for: [osm-features-backend]
  notes: 'BACKEND ONLY, POST form field data=<OverpassQL>. Overloaded on test day: instant 502 ''at capacity'', hangs of
    20-45 s with zero bytes, then 200 after 44.7 s (query) and 40.3 s (status); CORS header present even on 502. Use client
    timeout of at least 90 s, one request at a time, exponential backoff, persistent cache, small bboxes and [timeout:N];
    keep the endpoint configurable (FOSSGIS: do not hardcode). Fallback https://overpass.private.coffee/api/interpreter
    did not answer in 2 attempts (unverified). For heavy use run an own instance or a Geofabrik extract. Test query returned
    3 charging_station nodes in 49.87,8.64,49.88,8.66. Status candidate stands for ''partial''; promote to verified once
    an instance strategy is chosen.'
