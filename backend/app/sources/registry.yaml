  cors: true
  usage: 'Acceptable-use policy (https://operations.osmfoundation.org/policies/nominatim/): absolute maximum 1 request per
    second for the whole app (all users summed); valid User-Agent or Referer identifying the app; display attribution; no
    auto-complete; no systematic or bulk queries; cache results; the app must be switchable without a software update; LLM
