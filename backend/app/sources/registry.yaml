  attribution: © OpenStreetMap contributors
  coverage:
    name: World
    bbox: [-180, -90, 180, 90]
  cors: true
  usage: 'Demo server, fair use: ''You are welcome to use the API for your project as long as the number of requests stay
    in a reasonable limit. Extensive usage will be throttled or completely banned.'' No numeric limit, no availability guarantee,
    changes without notice (https://github.com/komoot/photon#demo-server, https://photon.komoot.io/). Our rule: only user-triggered
    debounced requests (at least 300 ms, at least 3 characters), cache responses; self-host for volume.'
  key_required: false
  status: verified
  checked: 2026-11-01
  used_for: [geocoding-search]
  notes: 'Public instance runs Photon 1.3.0, data timestamp 2026-10-24. lang accepts only default, de, en, fr (HTTP 400
    otherwise). extent is [west, north, east, south]. The same OSM object can appear several times with different osm_key/osm_value:
    de-duplicate by osm_type + osm_id. Verified filters: countrycode=DE, bbox, layer, osm_tag (deprecated), include=osm.<key>.<value>;
    soft focus lat/lon with zoom (default 12) and location_bias_scale (default 0.4; zoom=13 and 0.1 favours local hits).
