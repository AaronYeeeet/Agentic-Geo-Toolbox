# LiteLLM proxy: one OpenAI-compatible endpoint for all models.
# The backend asks for a model by the name on the left (LLM_MODEL in .env, default "default").
# Changing models = edit this file and run `docker compose restart litellm`.
# All models below are free on OpenRouter and support tool calling.

model_list:
  # OpenRouter's free router: picks one of the currently free models per request
  - model_name: default
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  # NVIDIA Nemotron 3.5 Super VL: also reads images (e.g. map screenshots), 1M context
  - model_name: nemotron-3.5-super-vl
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-super-vl:free
      api_key: os.environ/OPENROUTER_API_KEY

  # NVIDIA Nemotron 3 Ultra (550B): largest free model, text only
  - model_name: nemotron-3-ultra
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # NVIDIA Nemotron 3.5 Lightning: fast and small, text only
  - model_name: nemotron-3.5-lightning
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Google Gemma 4 31B: reads images
  - model_name: gemma-4-31b
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Google Gemma 4 26B (mixture of experts, 4B active): faster than 31B, reads images
  - model_name: gemma-4-26b
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  num_retries: 2
  # If a model fails (e.g. 429 rate limit on free models), try the next ones in order
  fallbacks:
    - default: [nemotron-3-ultra, gemma-4-31b]
    - nemotron-3.5-super-vl: [gemma-4-31b]
    - nemotron-3-ultra: [nemotron-3.5-super-vl]
    - gemma-4-31b: [gemma-4-26b]

litellm_settings:
  drop_params: true   # silently drop parameters a model doesn't support

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
